[project]
name = "deteccao-cancer-mama"
version = "0.1.0"
description = "Detecção de câncer de mama em mamografias digitais com Deep Learning e explicabilidade"
requires-python = ">=3.11"

# ─────────────────────────────────────────────────────────────
# Ruff — linter (substitui flake8/isort)
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models", "notebooks", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort (ordenação de imports)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplificações
]
ignore = [
    "E501",  # comprimento de linha é responsabilidade do black
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ─────────────────────────────────────────────────────────────
# Black — formatador
# ─────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "(data|models|\\.venv)/"

# ─────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: testes lentos (treino, leitura de dataset completo)",
    "gpu: testes que exigem GPU",
]

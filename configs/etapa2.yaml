# Etapa 2 do pré-processamento do RSNA: PNG da Etapa 1 -> tensor de entrada do modelo.
# Roda em tempo de carregamento (Dataset). O realce pode vir pré-calculado da pasta
# gerada por scripts/rsna_realce_gerar.py (mesmo resultado que calcular na hora).
# Os caminhos da máquina (etapa1_dir, realce_dir, verificacao_dir) ficam na seção
# `etapa2` do configs/local.yaml, fora do git. As seções `entrada` e
# `augmentation` vão junto com cada checkpoint (ConfigEtapa2.para_checkpoint).

entrada:
  altura: 768
  largura: 512
  # "cinza": anatomia repetida 3x. "realce_3canais": R = anatomia, G = top-hat, B = CLAHE.
  representacao: cinza
  # Normalização do ImageNet, por canal
  media: [0.485, 0.456, 0.406]
  desvio: [0.229, 0.224, 0.225]
  # Só para "realce_3canais"; calculado no tamanho da Etapa 1 com spacing_resultante_mm.
  # Mudar qualquer valor exige gerar a pasta de realce de novo (o Dataset confere).
  realce:
    tophat_mm: 0.6          # diâmetro do disco do top-hat
    mediana: 3              # mediana 3x3 antes do top-hat (1 desliga)
    percentil_tophat: 99.9  # G: mediana do tecido -> 0, este percentil -> 255
    clahe_clip: 2.0
    clahe_tiles: [8, 8]     # grade de tiles (colunas, linhas)

# Desligada por padrão; o script de treino liga só no split de treino.
# Nunca há flip horizontal: a parede torácica fica sempre à esquerda.
augmentation:
  ativa: false
  prob_flip_vertical: 0.5
  rotacao_graus: 10       # uniforme em [-10, 10], em torno do meio da parede
  escala: [0.9, 1.1]
  translacao: 0.05        # fração da altura/largura do canvas, em cada eixo
  brilho: 0.1             # soma uniforme em [-0.1, 0.1] da escala, só dentro da máscara
  contraste: [0.9, 1.1]   # multiplica em torno da média do tecido, só dentro da máscara
  # Canais com brilho/contraste. Geometria vale para todos. No realce, só R (0):
  # mexer em G e B distorceria o que o top-hat e o CLAHE medem.
  canais_fotometricos: [0]

carregamento:
  workers: 8
  batch_size: 12   # 16 não cabe nos 8 GB da RTX 4060 em 768x512

# scripts/rsna_realce_gerar.py
geracao_realce:
  workers: 8
  amostra_n: 50
